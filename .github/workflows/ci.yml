name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, herd-service, monitoring-service]
    defaults:
      run:
        working-directory: HerdVision_backend/services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3, openssl, mbstring
          coverage: none
          tools: composer:v2

      - name: Diretório de cache do Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.service }}-${{ hashFiles(format('HerdVision_backend/services/{0}/composer.lock', matrix.service)) }}
          restore-keys: composer-${{ matrix.service }}-

      - name: composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: .env de teste
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (pint)
        run: vendor/bin/pint --test

      - name: Testes
        run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HerdVision_frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: HerdVision_frontend/package-lock.json

      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build

  deploy-frontend:
    name: deploy-frontend (Vercel)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://herdvision-frontend.vercel.app
    concurrency:
      group: deploy-frontend
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar a Vercel CLI
        run: npm install --global vercel@latest

      # O projeto na Vercel tem Root Directory = HerdVision_frontend,
      # então a CLI roda a partir da raiz do repositório.
      - name: Baixar configuração e variáveis de produção
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # VITE_AUTH_API_URL e VITE_API_MODE são do tipo "Sensitive" na Vercel, e o
      # `vercel pull` não devolve o valor delas (vem um placeholder). São valores
      # públicos (vão para o bundle), então ficam definidos aqui.
      - name: Variáveis públicas do frontend
        run: |
          f=.vercel/.env.production.local
          sed -i '/^VITE_AUTH_API_URL=/d;/^VITE_API_MODE=/d' "$f"
          echo 'VITE_AUTH_API_URL="https://auth-service-od2h.onrender.com"' >> "$f"
          echo 'VITE_API_MODE="live"' >> "$f"
          grep -o '^VITE_[A-Z_]*=' "$f"

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Conferir as URLs no bundle
        run: |
          js=$(find . -path '*/.vercel/output/static/assets/*.js' -not -path '*/node_modules/*')
          [ -n "$js" ] || { echo "::error::bundle não encontrado em .vercel/output"; exit 1; }
          for url in https://auth-service-od2h.onrender.com https://herd-service-dy54.onrender.com https://monitoring-service-gm4u.onrender.com; do
            grep -q "$url" $js || { echo "::error::$url não está no bundle"; exit 1; }
          done
          if grep -q 'SENSITIVE' $js; then echo "::error::placeholder [SENSITIVE] no bundle"; exit 1; fi

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
